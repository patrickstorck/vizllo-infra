version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0", "--port", "3000"]
    ports:
      - "3347:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_BASE_URL=https://www.api.vizllo.com
    volumes:
      - ./frontend:/app
    networks:
      - vizllo-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.production
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8347:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - FRONTEND_URL=https://www.vizllo.com
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-changeme}
    volumes:
      - ./backend:/app
    networks:
      - vizllo-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "run"]
    env_file:
      - .env
    networks:
      - vizllo-net

networks:
  vizllo-net:
    driver: bridge
