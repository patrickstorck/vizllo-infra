version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: ["npm", "run", "dev", "--", "-p", "3000"]
    ports:
      - "3347:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
    networks:
      - vizllo-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./backend:/app
    networks:
      - vizllo-net

  cloudflared:
    image: cloudflare/cloudflared:2024.8.1
    restart: unless-stopped
    command: ["tunnel", "run"]
    env_file:
      - .env
    depends_on:
      - frontend
      - backend
    networks:
      - vizllo-net

networks:
  vizllo-net:
    driver: bridge
